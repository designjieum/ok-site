<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OK Site</title>
<style>
  :root {
    --bg: #0f172a;
    --bg-alt: #1e293b;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --accent: #38bdf8;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }

  header {
    padding: 24px 20px;
    border-bottom: 1px solid var(--bg-alt);
    text-align: center;
  }

  header .logo {
    font-weight: 700;
    font-size: 1.2rem;
    letter-spacing: 0.05em;
  }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  .hero {
    max-width: 640px;
    text-align: center;
  }

  .hero h1 {
    font-size: clamp(2rem, 5vw, 3rem);
    margin-bottom: 16px;
  }

  .hero p {
    color: var(--muted);
    font-size: 1.1rem;
    line-height: 1.6;
    margin-bottom: 32px;
  }

  .btn {
    display: inline-block;
    padding: 12px 28px;
    background: var(--accent);
    color: #0f172a;
    font-weight: 600;
    border-radius: 8px;
    text-decoration: none;
    transition: opacity 0.2s ease;
  }

  .btn:hover {
    opacity: 0.85;
  }

  footer {
    padding: 20px;
    text-align: center;
    color: var(--muted);
    font-size: 0.85rem;
    border-top: 1px solid var(--bg-alt);
  }
</style>
</head>
<body>
  <header>
    <div class="logo">OK Site</div>
  </header>

  <main>
    <div class="hero">
      <h1>안녕하세요</h1>
      <p>Cloudflare Pages로 배포된 간단한 정적 웹사이트입니다.</p>
      <a class="btn" href="#">시작하기</a>
    </div>
  </main>

  <footer>
    &copy; 2026 OK Site. All rights reserved.
  </footer>
</body>
</html>
